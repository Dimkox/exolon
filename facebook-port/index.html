<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exolon — Facebook Gaming Instant Games</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game-container {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { display: block; image-rendering: pixelated; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000; color: #FFF; font: bold 24px monospace;
      flex-direction: column; gap: 16px;
    }
    #loading.hidden { display: none; }
    .progress-bar { width: 200px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #0AF; transition: width 0.2s; width: 0%; }
  </style>
</head>
<body>
  <div id="loading">
    <div>EXOLON</div>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  </div>
  <div id="game-container">
    <canvas id="game-canvas" width="512" height="448"></canvas>
  </div>

  <!-- FB Instant Games SDK -->
  <script src="https://connect.facebook.net/en_US/fbinstant.6.2.js"></script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
