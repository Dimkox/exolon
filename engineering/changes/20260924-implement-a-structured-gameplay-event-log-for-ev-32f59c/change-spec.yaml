  "invariants": [
    {
      "id": "INV-001",
      "statement": "Within one (run_id, rot) stream, seq increases strictly by 1; tick and frame are non-decreasing across the file; a single writer assigns seq (total order).",
      "evidence": [
        {"test": "engineering/changes/20260924-implement-a-structured-gameplay-event-log-for-ev-32f59c/evidence/gameplay_log_check.py::stream_invariants"}
      ]
    },
    {
      "id": "INV-002",
      "statement": "ts_us equals round(tick*1000000/60) for every record: derived from the tick counter, never wall clock, never accumulated rounding.",
      "evidence": [
        {"test": "engineering/changes/20260924-implement-a-structured-gameplay-event-log-for-ev-32f59c/evidence/gameplay_log_check.py::ts_us_derivation"}
      ]
    },
    {
      "id": "INV-003",
      "statement": "The tick and frame counters are process-global: never reset by zone transition, death, respawn, pause, beginFromTitle or restartFromBeginning; GameplayEventKind raw values are append-only and an unknown value formats as unknown<N>, never aliasing a real name.",
      "evidence": [
        {"test": "engineering/changes/20260924-implement-a-structured-gameplay-event-log-for-ev-32f59c/evidence/gameplay_log_check.py::counters_never_reset"},
        {"test": "engineering/changes/20260924-implement-a-structured-gameplay-event-log-for-ev-32f59c/evidence/gameplay_log_check.py::kind_enum_append_only"}
      ]
    },
    {
      "id": "INV-004",
      "statement": "The hot path stays allocation-free: GameplayEventLog.emit contains no String, Array, Dictionary, Data, URL, DateFormatter or closure allocation (grep gate) and the Diagnostics files import nothing beyond Foundation.",
      "evidence": [
        {"test": "engineering/changes/20260924-implement-a-structured-gameplay-event-log-for-ev-32f59c/evidence/gameplay_log_check.py::hot_path_is_allocation_free"},
